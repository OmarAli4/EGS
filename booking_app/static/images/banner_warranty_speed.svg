<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="b4_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050E1F"/>
      <stop offset="45%" stop-color="#0C2340"/>
      <stop offset="85%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="b4_green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="b4_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="b4_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#10B981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="450" fill="url(#b4_bg)" rx="16"/>

  <!-- Left Visual: Golden Warranty Shield + Speedometer -->
  <g transform="translate(110, 60)">
    <!-- Ambient Green Glow -->
    <circle cx="230" cy="160" r="150" fill="#10B981" opacity="0.15" filter="url(#b4_glow)"/>

    <!-- Warranty Shield -->
    <path d="M 230 40 L 330 80 L 330 180 C 330 250, 230 290, 230 290 C 230 290, 130 250, 130 180 L 130 80 Z" fill="#064E3B" stroke="#34D399" stroke-width="4" filter="url(#b4_glow)"/>
    <path d="M 230 65 L 305 95 L 305 175 C 305 230, 230 265, 230 265 C 230 265, 155 230, 155 175 L 155 95 Z" fill="#042F2E" stroke="#10B981" stroke-width="2"/>
    
    <!-- Shield Icon & Text -->
    <text x="230" y="145" font-family="'Cairo', sans-serif" font-size="34" font-weight="900" fill="#FDE68A" text-anchor="middle">ضمان</text>
    <text x="230" y="195" font-family="'Impact', sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" text-anchor="middle">6 شهور</text>
    <text x="230" y="235" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle">أو 10,000 كم معتمد</text>
  </g>

  <!-- Right Typography -->
  <g transform="translate(680, 75)" text-anchor="end">
    <!-- Tag -->
    <rect x="290" y="0" width="310" height="36" rx="18" fill="rgba(16, 185, 129, 0.25)" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="580" cy="18" r="5" fill="#10B981"/>
    <text x="565" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#A7F3D0">⏱️ سرعة فائقة وضمان ذهبي</text>

    <!-- Main Headline -->
    <text x="600" y="85" font-family="'Cairo', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF">
      وصول خلال <tspan fill="url(#b4_green)">45 دقيقة</tspan> لباب بيتك
    </text>

    <!-- Subtitle -->
    <text x="600" y="130" font-family="'Cairo', sans-serif" font-size="18" font-weight="600" fill="rgba(255, 255, 255, 0.9)">
      أسطول شاحنات مجهز بفنيين معتمدين وأحدث المعدات بدون أي انتظار
    </text>
    <text x="600" y="160" font-family="'Cairo', sans-serif" font-size="16" font-weight="500" fill="#6EE7B7">
      ✓ نغطي كامل مناطق الشيخ زايد ومدينة 6 أكتوبر وضواحيها
    </text>

    <!-- Mini Features Group -->
    <g transform="translate(180, 195)">
      <rect x="280" y="0" width="140" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)"/>
      <text x="350" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">🚚 أسطول متنقل</text>

      <rect x="140" y="0" width="130" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)"/>
      <text x="205" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">📍 تتبع GPS مباشر</text>

      <rect x="0" y="0" width="130" height="34" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)"/>
      <text x="65" y="22" font-family="'Cairo', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">🧾 فاتورة وضمان</text>
    </g>

    <!-- CTA Button Graphic -->
    <g transform="translate(380, 255)">
      <rect x="0" y="0" width="220" height="48" rx="12" fill="url(#b4_green)" filter="url(#b4_glow)"/>
      <text x="110" y="30" font-family="'Cairo', sans-serif" font-size="16" font-weight="900" fill="#050E1F" text-anchor="middle">احجز صيانة فورية 🚚</text>
    </g>
  </g>
</svg>