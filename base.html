{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Service Bay — صيانة عربيتك عند باب البيت{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zain:wght@400;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC;
  --deep:#132132; --deep-soft:#41536B; --muted:#7C8B9E;
  --primary:#1E6BE0; --primary-dark:#1655B4; --primary-tint:#EAF1FD;
  --accent:#F5A524; --accent-tint:#FEF6E7;
  --line:#DDE3EA; --go:#1E9E6A; --go-tint:#E8F6F0; --stop:#C9463C;
  --r:10px;
  --sh:0 1px 2px rgba(19,33,50,.06), 0 8px 24px rgba(19,33,50,.05);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition-duration:.001ms!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--deep);
  font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.zn{font-family:"Zain","IBM Plex Sans Arabic",sans-serif;font-weight:900;line-height:1.12}
.num{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:4px}

/* header */
header{position:sticky;top:0;z-index:70;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Zain";font-weight:900;font-size:25px}
.logo .cube{width:30px;height:30px;border-radius:8px;background:var(--deep);display:grid;place-items:center}
.logo .cube span{width:12px;height:12px;border-radius:3px;background:var(--accent)}
.hph{font-size:14px;color:var(--muted)}
.hph b{color:var(--deep);font-weight:600}
@media(max-width:560px){.hph{display:none}}

/* buttons */
.btn{font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:var(--r);
  padding:13px 26px;border:1px solid transparent;background:var(--primary);color:#fff;
  transition:background .2s var(--ease),transform .2s var(--ease),box-shadow .2s var(--ease)}
.btn:hover:not(:disabled){background:var(--primary-dark);transform:translateY(-1px);box-shadow:0 6px 18px rgba(30,107,224,.28)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--deep-soft)}
.btn.ghost:hover{background:var(--surface);border-color:var(--deep-soft);color:var(--deep);box-shadow:none}
.btn.dark{background:var(--deep)}
.btn.dark:hover{background:#0B1725;box-shadow:0 6px 18px rgba(19,33,50,.24)}
.btn.sm{padding:10px 20px;font-size:14px}

.tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
  padding:5px 12px;border-radius:999px;background:var(--accent-tint);color:#8A5D06}
.tag.blue{background:var(--primary-tint);color:var(--primary-dark)}
.tag.go{background:var(--go-tint);color:var(--go)}
footer{border-top:1px solid var(--line);margin-top:70px;padding:30px 0 46px;color:var(--muted);font-size:13.5px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
{% block extra_css %}{% endblock %}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a href="{% url 'booking:home' %}" class="logo"><span class="cube"><span></span></span> Service Bay</a>
    <div class="hph">للاستفسار · <b class="num">0100 000 0000</b></div>
  </div>
</header>

{% block content %}{% endblock %}

<div class="wrap"><footer>
  <span>Service Bay — صيانة عربيات متنقلة · أكتوبر والشيخ زايد</span>
  <span>مواعيد يومية من ٩ ص لـ ٩ م</span>
</footer></div>

{% block scripts %}{% endblock %}
</body>
</html>
