<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <!-- Left Arc Gradient: Cyan #00D2FF to Blue #0080FF -->
    <linearGradient id="egsGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>

    <!-- Middle Arc Gradient: #0080FF to #0055FF -->
    <linearGradient id="egsGradMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>

    <!-- Right Arc Gradient: #0066FF to Deep Blue #003DBD -->
    <linearGradient id="egsGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#003DBD"/>
    </linearGradient>

    <!-- Needle Gradient: #0055FF at base -> #00A3FF mid -> #FFFFFF at tip -->
    <linearGradient id="egsNeedleGrad" x1="0" y1="105" x2="0" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="50%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Gauge Subtle Blue Drop Shadow -->
    <filter id="egsGaugeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0066FF" flood-opacity="0.18"/>
    </filter>

    <!-- Needle Cyan Glow -->
    <filter id="egsNeedleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00D2FF" flood-opacity="0.70"/>
    </filter>
  </defs>

  <style>
    @keyframes egsRevNeedle {
      0%   { transform: rotate(-50deg); }
      18%  { transform: rotate(36deg); }
      32%  { transform: rotate(10deg); }
      48%  { transform: rotate(40deg); }
      64%  { transform: rotate(-15deg); }
      80%  { transform: rotate(22deg); }
      100% { transform: rotate(-50deg); }
    }
    .egs-needle-group {
      transform-box: view-box;
      transform-origin: 120px 105px;
      animation: egsRevNeedle 3.2s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }
    .egs-subtitle {
      font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 10.5px;
      letter-spacing: 0.2px;
      fill: #0B0B0E;
    }
  </style>

  <!-- 1. SPEEDOMETER GAUGE (Top Section) -->
  <g filter="url(#egsGaugeShadow)">
    <!-- Left Segment: 165° to 226° -->
    <path d="M 40.79 126.22 A 82 82 0 0 1 63.04 46.01 L 78.32 61.84 A 60 60 0 0 0 62.04 120.53 Z" fill="url(#egsGradLeft)"/>
    <!-- Middle Segment: 232° to 308° -->
    <path d="M 69.52 40.38 A 82 82 0 0 1 170.48 40.38 L 156.94 57.72 A 60 60 0 0 0 83.06 57.72 Z" fill="url(#egsGradMid)"/>
    <!-- Right Segment: 314° to 375° -->
    <path d="M 176.96 46.01 A 82 82 0 0 1 199.21 126.22 L 177.96 120.53 A 60 60 0 0 0 161.68 61.84 Z" fill="url(#egsGradRight)"/>
  </g>

  <!-- 2. NEEDLE WITH ANIMATION & GLOW -->
  <g class="egs-needle-group" filter="url(#egsNeedleGlow)">
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-50 120 105; 38 120 105; 10 120 105; 42 120 105; -15 120 105; 25 120 105; -50 120 105"
      keyTimes="0; 0.22; 0.36; 0.54; 0.70; 0.86; 1"
      dur="3.2s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"
    />
    <!-- Tapered Needle Blade: ~80px long, 5px base width -->
    <polygon points="117.5,105 120,25 122.5,105" fill="url(#egsNeedleGrad)"/>
    <!-- White Center Spine Line (1.6px) -->
    <line x1="120" y1="102" x2="120" y2="28" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
    <!-- Pivot Hub Circle: r=4.5px, fill #0066FF, 1.5px white stroke border -->
    <circle cx="120" cy="105" r="4.5" fill="#0066FF" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- 3. "EGS" CUSTOM LETTERING (Bold, Sporty Slanted Block Letters) -->
  <g fill="#0B0B0E">
    <!-- Letter E -->
    <path d="M 57 104 L 63 71 L 93 71 L 91.6 77.5 L 70.8 77.5 L 69.4 83.5 L 88.5 83.5 L 87.1 89.8 L 68 89.8 L 66.5 97.5 L 90.5 97.5 L 89.1 104 Z"/>

    <!-- Letter G -->
    <path d="M 136 71 L 109 71 C 100 71 95 76 93 84 C 91 93 94.5 104 104 104 L 127 104 C 134 104 137.5 99.5 138.5 94 L 139.5 87 L 117.5 87 L 116.3 93 L 126.5 93 L 125.4 97.5 C 124.8 98.8 122.5 99.2 119.5 99.2 L 107 99.2 C 102 99.2 99.5 95 100.5 89 C 101.5 83 105 76.5 112 76.5 L 134.8 76.5 Z"/>

    <!-- Letter S -->
    <path d="M 178 71 L 150 71 C 143 71 139 74.8 138 79.5 C 137 85.5 141 89 148 90.8 L 159 93.8 C 164.5 95.2 165.8 97 165.2 99.2 C 164.2 102.5 160 104 153.5 104 L 137 104 L 138.5 98 L 145.5 98 C 149.5 98 153 98 154 96.5 C 154.8 95 153 94 147 92.5 L 137.5 90 C 131 88 129.5 83 130.5 78 C 132 72.8 137.5 71 146.5 71 L 178 71 Z"/>
  </g>

  <!-- 4. SUBTITLE -->
  <text x="120" y="132" text-anchor="middle" class="egs-subtitle">Elite Garage Service Center</text>
</svg>
