<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="b2_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07152B"/>
      <stop offset="40%" stop-color="#141E3D"/>
      <stop offset="85%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="b2_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="b2_cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="b2_gold_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="450" fill="url(#b2_bg)" rx="16"/>

  <!-- Left Visual: Big 15% OFF 3D Badge + Sparkles -->
  <g transform="translate(100, 60)">
    <!-- Ambient Gold Glow -->
    <circle cx="240" cy="160" r="160" fill="#F59E0B" opacity="0.15" filter="url(#b2_gold_glow)"/>

    <!-- Decorative Starburst -->
    <polygon points="240,40 260,110 330,110 275,150 295,220 240,175 185,220 205,150 150,110 220,110" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1.5"/>

    <!-- 3D 15% Text Box -->
    <rect x="80" y="80" width="320" height="170" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="url(#b2_gold)" stroke-width="3.5" filter="url(#b2_gold_glow)"/>
    <text x="240" y="170" font-family="'Impact', 'Arial Black', sans-serif" font-size="88" font-weight="900" fill="url(#b2_gold)" text-anchor="middle" letter-spacing="2">15%</text>
    <text x="240" y="225" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">OFF | خصم فوري</text>

    <!-- InstaPay Floating Badge -->
    <g transform="translate(110, 260)">
      <rect x="0" y="0" width="260" height="44" rx="10" fill="#7C3AED" stroke="#C4B5FD" stroke-width="2"/>
      <text x="130" y="28" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">⚡ دفع فوري عبر InstaPay</text>
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(680, 75)" text-anchor="end">
    <!-- Tag -->
    <rect x="280" y="0" width="320" height="36" rx="18" fill="rgba(245, 158, 11, 0.2)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="580" cy="18" r="5" fill="#F59E0B"/>
    <text x="565" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="800" fill="#FEF08A">🎁 عرض ترويجي لفترة محدودة</text>

    <!-- Main Headline -->
    <text x="600" y="85" font-family="'Cairo', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF">
      وفر <tspan fill="url(#b2_gold)">15%</tspan> على باقات الصيانة الشاملة
    </text>

    <!-- Subtitle -->
    <text x="600" y="130" font-family="'Cairo', sans-serif" font-size="18" font-weight="600" fill="rgba(255, 255, 255, 0.9)">
      صيانة دورية متكاملة لسيارتك تشمل الفحص والزيوت والفلاتر الأصلية
    </text>

    <!-- Coupon Box -->
    <g transform="translate(240, 160)">
      <rect x="0" y="0" width="360" height="52" rx="10" fill="rgba(255, 255, 255, 0.08)" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8,6"/>
      <text x="340" y="32" font-family="'Cairo', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">كود الخصم:</text>
      <text x="210" y="34" font-family="'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#FDE68A" letter-spacing="3">EGS15</text>
      <rect x="20" y="8" width="110" height="36" rx="6" fill="#F59E0B"/>
      <text x="75" y="31" font-family="'Cairo', sans-serif" font-size="12" font-weight="800" fill="#050E1F" text-anchor="middle">خصم 15%</text>
    </g>

    <!-- CTA Button Graphic -->
    <g transform="translate(380, 255)">
      <rect x="0" y="0" width="220" height="48" rx="12" fill="url(#b2_gold)" filter="url(#b2_gold_glow)"/>
      <text x="110" y="30" font-family="'Cairo', sans-serif" font-size="16" font-weight="900" fill="#050E1F" text-anchor="middle">استفد من العرض الآن 🏷️</text>
    </g>
  </g>
</svg>